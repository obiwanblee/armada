name: Build wvkbd
on:
  push:
    branches: [wvkbd-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: fedora:44
    steps:
      - name: Install build deps
        run: |
          dnf install -y git make gcc pkgconf-pkg-config \
            wayland-devel wayland-protocols-devel libxkbcommon-devel \
            cairo-devel pango-devel tar gzip findutils

      - name: Checkout (for patch script)
        uses: actions/checkout@v4

      - name: Build patched wvkbd
        run: |
          git clone --depth 1 https://github.com/jjsullivan5196/wvkbd.git
          bash patch-wvkbd.sh        # inject uinput injection (KWin lacks wlr virtual-keyboard)
          make -C wvkbd wvkbd-mobintl # binary only, skip man page (needs scdoc)
          ls -l wvkbd/wvkbd-*
          echo "=== uinput symbol present in binary? ==="
          strings wvkbd/wvkbd-mobintl | grep -i uinput || true

      - name: Package binary
        run: |
          mkdir -p out
          cp wvkbd/wvkbd-mobintl out/
          ls -l out/
          tar czf wvkbd-arm64.tar.gz -C out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wvkbd-arm64
          path: wvkbd-arm64.tar.gz
          retention-days: 5
