name: Build wvkbd
on:
  push:
    branches: [wvkbd-ci]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: fedora:44
    steps:
      - name: Install build deps
        run: |
          dnf install -y git make gcc pkgconf-pkg-config \
            wayland-devel wayland-protocols-devel libxkbcommon-devel \
            cairo-devel pango-devel tar gzip findutils

      - name: Build wvkbd
        run: |
          git clone --depth 1 https://github.com/jjsullivan5196/wvkbd.git
          make -C wvkbd
          ls -l wvkbd/wvkbd-*
          echo "=== runtime libs needed ==="
          ldd wvkbd/wvkbd-mobintl || true

      - name: Package binary
        run: |
          mkdir -p out
          cp wvkbd/wvkbd-* out/ 2>/dev/null || cp wvkbd/wvkbd-mobintl out/
          ls -l out/
          tar czf wvkbd-arm64.tar.gz -C out .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wvkbd-arm64
          path: wvkbd-arm64.tar.gz
          retention-days: 5
